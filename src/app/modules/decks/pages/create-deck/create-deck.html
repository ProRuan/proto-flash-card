<app-core-header></app-core-header>

<main class="create-deck">
    <h2 class="title">Create Deck</h2>

    <form [formGroup]="form" class="form" (ngSubmit)="onSubmit()">
        <label for="name" class="label">Name</label>
        <input id="name" formControlName="name" type="text" class="input" placeholder="Enter deck name">

        <label for="category" class="label">Category</label>
        <input id="category" formControlName="category" type="text" class="input" placeholder="Enter deck category">

        <button type="submit" class="button" [disabled]="form.invalid">Create Deck</button>
    </form>
</main>

<app-core-footer></app-core-footer>
