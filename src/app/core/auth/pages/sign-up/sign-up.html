<app-core-header></app-core-header>

<main class="sign-up">
    <h2 class="title">Sign up</h2>

    <form [formGroup]="form" class="form" (ngSubmit)="onSubmit()">
        <label for="name" class="label">Name</label>
        <input value="form.getValue('name')" type="text" id="name" name="name" class="input" autocomplete="name"
            formControlName="name" />

        <label for="email" class="label">Email</label>
        <input value="form.getValue('email')" type="email" id="email" name="email" class="input" autocomplete="email"
            inputmode="email" formControlName="email" />

        <label for="password" class="label">Password</label>
        <input value="form.getValue('password')" type="password" id="password" name="password" class="input"
            autocomplete="new-password" formControlName="password" />

        <label for="confirm-password" class="label">Confirm Password</label>
        <input value="form.getValue('confirmPassword')" type="password" id="confirm-password" name="confirm-password"
            class="input" autocomplete="new-password" formControlName="confirmPassword" />

        <button type="submit" class="button">Sign up</button>
    </form>

    @if (
    form.hasError('passwordMismatch') &&
    form.get('confirmPassword')?.touched
    ) {
    <p>Passwords do not match.</p>
    }
</main>

<app-core-footer></app-core-footer>
