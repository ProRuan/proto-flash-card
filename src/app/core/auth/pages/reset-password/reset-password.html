<app-core-header></app-core-header>

<main class="reset-password">
    <h2 class="title">Reset password</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <label for="email" class="label">Email</label>
        <input formControlName="email" type="email" id="email" name="email" class="input" autocomplete="email"
            inputmode="email" />

        <label for="password" class="label">New password</label>
        <input formControlName="password" type="password" id="password" name="password" class="input"
            autocomplete="new-password" />

        <label for="confirm-password" class="label">Confirm new password</label>
        <input formControlName="confirmPassword" type="password" id="confirm-password" name="confirm-password"
            class="input" autocomplete="new-password" />

        <button type="submit" class="button">Reset password</button>
    </form>

    @if (
    form.hasError('passwordMismatch') &&
    form.get('confirmPassword')?.touched
    ) {
    <p>Passwords do not match.</p>
    }
</main>

<app-core-footer></app-core-footer>
